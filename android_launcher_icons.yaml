# Regenerate Android resources only, preserving the existing artwork.
# dart run flutter_launcher_icons -f android_launcher_icons.yaml
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/launcher_legacy.png
  adaptive_icon_background: "#073486"
  adaptive_icon_foreground: assets/icon/launcher_adaptive.png
  # The foreground source already includes the adaptive safe-area padding.
  adaptive_icon_foreground_inset: 0
