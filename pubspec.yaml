name: my_library
description: A local-first personal library and lending tracker.
publish_to: none
version: 1.0.0+10

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  http: ^1.2.2
  image_picker: ^1.2.4
  image_picker_android: ^0.8.13+25
  image_picker_platform_interface: ^2.11.2
  image_cropper: ^13.0.0
  path_provider: ^2.1.6
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  path: ^1.9.0
  sqflite: ^2.4.1
  uuid: ^4.5.1
  unorm_dart: ^0.3.0
  flutter_local_notifications: ^23.0.0
  flutter_timezone: ^5.1.1
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/my_library_icon_1024.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
