name: my_library
description: A local-first personal library and lending tracker.
publish_to: none
version: 1.0.0+8

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  mobile_scanner: ^7.4.2
  path: ^1.9.0
  sqflite: ^2.4.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/my_library_icon_1024.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
